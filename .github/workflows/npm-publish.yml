name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Enforce Node coverage
        run: npm run coverage:node

      - name: Preview packed package
        run: npm pack --dry-run

      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node --print "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          test "$GITHUB_REF_NAME" = "$PACKAGE_VERSION"

      - name: Publish to npm with trusted publishing
        run: npm publish --access public
